<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="./../css/navbar.css">
    <link rel="stylesheet" href="./../css/signup.css">

</head>

<body>
    <div class="navbar-container">

        <div class="item1">
            <img src="./../images/sairang-logo.jpeg" class="navbar-logo" />
            <b class="website-name">Sairang</b>
        </div>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="hamburger">
            <img src="./../images/humburger.png" class="navbar-humburger-logo" />
        </label>



        <div class="item2">
            <a href="./../index.html" class="menu-item">Home</a>
            <a href="#" class="menu-item">Destinations</a>
            <a href="#" class="menu-item">Trip Planner</a>
            <a href="#" class="menu-item">Gallery</a>
            <a href="#" class="menu-item">Contact</a>
        </div>


        <div class="item3">
            <a href="#" class="menu-item">Login</a>
            <a href="#" class="menu-item">Sign up</a>

        </div>
    </div>



    <div class="main-container">

        <div class="signup-card">


            <div class="right-section">

                <img src="https://cdni.iconscout.com/illustration/premium/thumb/sign-up-4489361-3723271.png"
                    class="right-img">

                <h1 class="right-heading">
                    Join Sairang
                </h1>

                <p class="right-description">
                    Every Journey Begins with Sairang
                </p>

            </div>



            <div class="left-section">

                <h1 class="signup-heading">Create Account</h1>

                <input type="text" placeholder="Full Name" class="input-box" id="fullName">

                <input type="email" placeholder="Email Address" class="input-box" id="email">

                <input type="tel" placeholder="Mobile Number" class="input-box" id="mobile">


                <div class="password-box">

                    <input type="password" placeholder="Password" class="input-box" id="password">
                    <img src="./../images/hide.png" id="eyeIconPassword" class="eye-icon">

                </div>


                <div class="password-box">

                    <input type="password" placeholder="Confirm Password" class="input-box" id="confirm-password">
                    <img src="./../images/hide.png" id="eyeIconConfrimPassword" class="eye-icon">

                </div>

                


                <div class="checkbox-container">
                    <input type="checkbox">
                    <span>I agree to Terms & Conditions</span>
                </div>

                <button class="signup-btn" id="signUpBtn">
                    Sign Up
                </button>


            </div>

        </div>

    </div>

    <script src="./../js/signup.js"></script>
</body>

</html>
